[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cmf-watch-client"
version = "1.0.0"
description = "Production Python client and reverse-engineered BLE protocol library for Nothing and CMF Smartwatches"
readme = "README.md"
authors = [
    { name = "Open Source Contributors" }
]
license = { text = "MIT" }
keywords = ["nothing", "cmf", "smartwatch", "ble", "bluetooth", "health", "fitness", "wearable", "reverse-engineering"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Hardware :: Hardware Drivers",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
requires-python = ">=3.9"
dependencies = [
    "bleak>=0.20.0",
    "cryptography>=38.0.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
]

[project.scripts]
cmf-watch-client = "cmf_watch_client.cli.main:main"

[project.urls]
Homepage = "https://github.com/joshuapassos/CMF-Watch-Pro-2-BLE-Protocol"
Repository = "https://github.com/joshuapassos/CMF-Watch-Pro-2-BLE-Protocol"
